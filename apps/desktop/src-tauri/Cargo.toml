[package]
name        = "glup"
version     = "0.1.0"
description = "Glup, una mascota de escritorio"
authors     = ["Glup contributors"]
license     = "MIT"
edition     = "2021"

# "Pasar audio a texto" on the graphics card lives in its own program (voz/, glup-voz.exe) so that a
# broken driver can only close that one. It is built on its own (`cargo build -p glup-voz`): built
# together with Glup, Cargo would join whisper-rs's features and Glup would link Vulkan too.
[workspace]
members         = [".", "voz"]
default-members = ["."]
resolver        = "2"

# Desktop only (Windows, and Mac and Linux if they come): the app links the library as an rlib. The
# staticlib and cdylib of the Tauri template are for iOS and Android, and cost about 0,8 GB per build.
# No doctests: the tests are unit tests inside the library.
[lib]
name       = "glup_lib"
crate-type = ["rlib"]
doctest    = false

# main.rs only calls glup_lib::run and has no tests: no test binary is linked for it.
[[bin]]
name = "glup"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                        = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog          = "2"
tauri-plugin-opener          = "2"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart       = "2.7"
# Updates: checks the latest Release of the repo, verifies its signature and installs it.
tauri-plugin-updater         = "2"
# "Copiar texto de la pantalla": the keyboard shortcut that works from any app (Apache-2.0 OR MIT).
tauri-plugin-global-shortcut = "2"
serde                        = { version = "1", features = ["derive"] }
serde_json                   = "1"
image                        = { version = "0.25", default-features = false, features = ["rayon", "avif", "bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
webp                         = "0.3"
oxipng                       = { version = "10", default-features = false, features = ["parallel"] }
lopdf                        = "0.47"
rayon                        = "1"
jpeg-encoder                 = "0.7"
jpeg-decoder                 = { version = "0.3", default-features = false }
zip                          = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
chrono                       = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir                      = "2.5"
blake3                       = "1.8"
trash                        = "5.4"
# Background removal: ONNX Runtime (prebuilt, linked at build time), the one-time model download and its check.
ort                          = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-31", "directml"] }
ureq                         = "3.5"
sha2                         = "0.11"
# Random file key for "Poner contraseña" (AES-256, done by lopdf).
getrandom                    = "0.3"
# Unpacks ffmpeg.exe, downloaded on its own out of the FFmpeg zip (see services/video/tool.rs).
flate2                       = { version = "1", default-features = false, features = ["zlib-rs"] }
# "Pasar audio a texto": whisper.cpp (MIT) through whisper-rs (Unlicense), on the processor. Building it needs CMake.
whisper-rs                   = "0.16"
# "Marca de agua" on photos: the letters of the fonts of Windows, drawn (Apache-2.0).
ab_glyph                     = "0.2"
qrcode = { version = "0.14", default-features = false }
rxing = { version = "0.8", default-features = false, features = ["encoding_rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_Performance", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Environment", "Win32_System_WindowsProgramming", "Wdk_System_SystemInformation"] }
# "Sacar texto": the OCR that comes with Windows (Windows.Media.Ocr). Same version Tauri already uses.
# Windows notifications with a click handler (the notification plugin has none on desktop).
tauri-winrt-notification = "0.8"
windows     = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Devices_Power", "Media_FaceAnalysis", "Media_Ocr", "Storage_Streams", "System_Power", "System_UserProfile", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell"] }

# Errors still show file and line, but the debug info weighs far less (target grew to tens of GB).
[profile.dev]
debug = "line-tables-only"

# Dependencies carry no debug info at all: a panic still points at our files and lines (glup keeps
# line-tables-only above), and target loses the .pdb of every crate. Package sections below only set
# opt-level, so this applies to them too.
[profile.dev.package."*"]
debug = false

# Image encoders (rav1e, oxipng) are very slow unoptimized; keep them fast in dev builds.
[profile.dev.package.rav1e]
opt-level = 3

[profile.dev.package.ravif]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.oxipng]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.libwebp-sys]
opt-level = 3

# "Quitar fondo" writes big PNGs and walks every pixel of the mask.
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3

# "Archivos repetidos": the hash of every candidate and the photos read for "fotos parecidas".
# Unoptimized, a WebP took half a second to read.
[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

# whisper.cpp (built by CMake): unoptimized it is far too slow to listen to anything.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

# The Rust side of ONNX Runtime (the runtime itself comes prebuilt).
[profile.dev.package.ort]
opt-level = 3

# Downloads (models, FFmpeg): the hash of every byte and the TLS of the connection. Unoptimized,
# checking a 539 MB model took 13,5 s on its own.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.rustls]
opt-level = 3

[profile.dev.package.ring]
opt-level = 3

# Unpacking ffmpeg.exe from the FFmpeg zip.
[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3
