# Builds Glup for Windows when a v*.*.* tag is pushed and leaves a draft Release with the NSIS
# installer, the .msi and the signed latest.json for the updater. The draft is published by hand.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The tag message holds the notes: they go to the Release and to latest.json (what Glup shows).
      - name: Notes and version check
        id: tag
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -n 1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::El tag ${GITHUB_REF_NAME} no coincide con la versión de Cargo.toml (${version}). Usa pnpm version:set."
            exit 1
          fi
          {
            echo 'notes<<GLUP_NOTES'
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d'
            echo 'GLUP_NOTES'
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # The Vulkan SDK (headers, glslc, vulkan-1.lib) to build glup-voz.exe: the LunarG installer, pinned
      # and checked, with its silent install. Only the base components (~1 min).
      - name: Vulkan SDK
        shell: pwsh
        run: |
          $version = '1.4.363.0'
          $url     = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          $file    = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
          Invoke-WebRequest $url -OutFile $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          if ($hash -ne '94A82D378F7A5E3E54C9DB7D2FB7016AF136E14AC0A18DBF0F2F67A36352D141') { throw "Vulkan SDK: hash inesperado $hash" }
          # A windowed installer: Start-Process -Wait, or PowerShell would go on before it ends.
          $setup = Start-Process $file -ArgumentList '--root', "C:\VulkanSDK\$version", '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Vulkan SDK: no se pudo instalar' }
          "VULKAN_SDK=C:\VulkanSDK\$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$version\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # glup-voz.exe ("Pasar audio a texto" on the graphics card), built apart and copied where Tauri
      # takes its sidecars (tauri.release.conf.json, externalBin).
      - name: glup-voz
        run: pnpm voz:build -Release

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # Only here: updater artifacts need the private key, which local builds do not have.
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Glup ${{ github.ref_name }}
          releaseBody: ${{ steps.tag.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # People install with the NSIS installer; updates use it too.
          updaterJsonPreferNsis: true
