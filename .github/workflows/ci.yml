# Checks every PR and every push to master: types, Vitest, the download page (apps/web: astro check,
# its tests and its build), cargo check and cargo test (without the ignored ones), and that everything
# the Release builds still builds: glup-voz (the graphics card's program, built apart) and the NSIS
# installer with it inside, the frontend of production (no demo) included.
# Unsigned and in debug: only the Release has the updater's key, and only it builds in release.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter desktop typecheck

      - name: Vitest
        run: pnpm --filter desktop test

      # The download page (apps/web): its types (astro check), its tests and its static build.
      - name: Web typecheck
        run: pnpm --filter web typecheck

      - name: Web tests
        run: pnpm --filter web test

      - name: Web build
        run: pnpm web:build

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      # The Vulkan SDK (headers, glslc, vulkan-1.lib) to build glup-voz.exe: the LunarG installer, pinned
      # and checked, with its silent install. Only the base components (~1 min).
      - name: Vulkan SDK
        shell: pwsh
        run: |
          $version = '1.4.363.0'
          $url     = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          $file    = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
          Invoke-WebRequest $url -OutFile $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          if ($hash -ne '94A82D378F7A5E3E54C9DB7D2FB7016AF136E14AC0A18DBF0F2F67A36352D141') { throw "Vulkan SDK: hash inesperado $hash" }
          # A windowed installer: Start-Process -Wait, or PowerShell would go on before it ends.
          $setup = Start-Process $file -ArgumentList '--root', "C:\VulkanSDK\$version", '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Vulkan SDK: no se pudo instalar' }
          Remove-Item $file
          "VULKAN_SDK=C:\VulkanSDK\$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$version\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # glup-voz built (not only checked) and put where Tauri takes its sidecars, as the Release does.
      - name: glup-voz
        run: pnpm voz:build -Sidecar

      # The installer as the Release makes it (its config, the sidecar, the Explorer's hooks, Spanish),
      # without the updater's signature (tauri.ci.conf.json). Nothing is uploaded.
      - name: Installer (debug, unsigned)
        working-directory: apps/desktop
        run: pnpm tauri build --debug --bundles nsis --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.ci.conf.json
